<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../html/shared.css"><link rel="stylesheet" href="readme.css"><link rel="stylesheet" href="charts.css">
<script src="charts.js"></script>
</head><body>
<div class="shot chart" data-shot style="--h:500px">
  <div class="bg"></div><div class="grid"></div>
  <div class="head">
    <div class="kicker">Time per screenshot · lower is faster</div>
    <h2>About <span class="hl">2x faster</span> than macOS screencapture</h2>
  </div>
  <div class="plot" id="plot" style="top:196px"></div>
  <div class="note">Median of 20 rounds at native Retina resolution, fresh process each time, tools in shuffled order. Apple M1, macOS 27.</div>
</div>
<script>
const { C, el, svg, hbar, fmt } = Charts;
const tools = ['snip', 'screencapture', 'python mss', 'Peekaboo 4.9'];
const panels = [
  { name: 'Full screen', ms: [376, 775, 693, 1127], note: [null, null, '1x only', null] },
  { name: 'Region', ms: [291, 611, 499, 1017], note: [null, null, '1x only', null] },
  { name: 'Window', ms: [453, 827, null, 5527] },
];
const W = 1296, gutter = 48, panelW = (W - gutter * 2) / 3, nameW = 128, barH = 26, gap = 12, cap = 1200;
const s = svg(document.getElementById('plot'), W, 44 + tools.length * (barH + gap));
panels.forEach((p, pi) => {
  const x0 = pi * (panelW + gutter), bx = x0 + nameW, bw = panelW - nameW - 92;
  el(s, 'text', { x: x0, y: 18, fill: C.ink, 'font-size': 20, 'font-weight': 700 }, p.name);
  tools.forEach((t, ti) => {
    const y = 40 + ti * (barH + gap), v = p.ms[ti], me = ti === 0;
    el(s, 'text', { x: bx - 12, y: y + barH / 2 + 5, fill: me ? '#fff' : C.ink2, 'font-size': 15, 'font-weight': me ? 700 : 550, 'text-anchor': 'end' }, t);
    if (v == null) {
      el(s, 'text', { x: bx, y: y + barH / 2 + 5, fill: C.ink3, 'font-size': 15, 'font-style': 'italic' }, 'not supported');
      return;
    }
    const broken = v > cap, w = (Math.min(v, cap) / cap) * bw;
    hbar(s, bx, y, w, barH, me ? C.accent : C.other);
    if (broken) {
      // Axis break: a gap cut through the bar, so the long bar doesn't flatten the rest.
      const bx2 = bx + w - 34;
      el(s, 'path', { d: `M${bx2},${y - 3} l8,${barH + 6} M${bx2 + 9},${y - 3} l8,${barH + 6}`, stroke: '#0d0f1d', 'stroke-width': 5 });
    }
    const label = el(s, 'text', { x: bx + w + 10, y: y + barH / 2 + 5, fill: me ? '#fff' : C.ink2, 'font-size': 15, 'font-weight': me ? 750 : 600 }, `${fmt(v)} ms`);
    if (p.note?.[ti]) el(label, 'tspan', { fill: C.ink3, 'font-weight': 500, dx: 8 }, p.note[ti]);
  });
});
</script>
</body></html>
